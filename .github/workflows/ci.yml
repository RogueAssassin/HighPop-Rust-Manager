name: CI

on:
  push:
    branches:
      - main
      - testing
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HighPop.sln

      - name: Audit XAML command surface
        shell: pwsh
        run: ./scripts/Test-UiSurface.ps1

      - name: Build
        run: dotnet build HighPop.sln -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project HighPop.SmokeTests/HighPop.SmokeTests.csproj -c Release --no-build

      - name: Verify single-file publish
        run: dotnet publish HighPop/HighPop.csproj -c Release -r win-x64 --self-contained true -o publish_out

      - name: Confirm portable output
        shell: pwsh
        run: |
          if (-not (Test-Path publish_out/HighPop.exe)) { throw "HighPop.exe was not produced" }
          if (-not (Test-Path publish_out/assets/README.txt)) { throw "assets/README.txt was not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_highpop.json)) { throw "Rust presets were not produced" }

      - name: Assemble and verify HPRM portable package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content HighPop/HighPop.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          ./scripts/Build-PortablePackage.ps1 `
            -PublishDirectory publish_out `
            -OutputDirectory package_out `
            -Version $version `
            -Commit "${{ github.sha }}"

      - name: Confirm minimal ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem package_out/HighPop-v*-win-x64.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $files = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } |
              Where-Object { -not $_.EndsWith('/') })
            $unexpected = @($files | Where-Object {
              $_ -ne 'HPRM/HighPop.exe' -and
              $_ -ne 'HPRM/CHANGELOG.md' -and
              -not $_.StartsWith('HPRM/assets/')
            })
            if ($unexpected.Count -gt 0) {
              throw "ZIP contains files outside the approved executable/assets/changelog set: $($unexpected -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload testing package
        uses: actions/upload-artifact@v4
        with:
          name: HighPop-testing-win-x64
          path: package_out/HighPop-v*-win-x64*
