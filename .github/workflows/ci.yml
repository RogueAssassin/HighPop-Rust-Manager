name: CI

on:
  push:
    branches:
      - main
      - testing
      - "agent/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HighPop.sln

      - name: Audit XAML command surface
        shell: pwsh
        run: ./scripts/Test-UiSurface.ps1

      - name: Build
        run: dotnet build HighPop.sln -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project HighPop.SmokeTests/HighPop.SmokeTests.csproj -c Release --no-build

      - name: Verify single-file publish
        run: dotnet publish HighPop.Desktop/HighPop.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish_out

      - name: Confirm portable output
        shell: pwsh
        run: |
          if (-not (Test-Path publish_out/HighPop.exe)) { throw "HighPop.exe was not produced" }
          if (-not (Test-Path publish_out/assets/README.txt)) { throw "assets/README.txt was not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_highpop.json)) { throw "Rust presets were not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_vanilla.json)) { throw "Vanilla preset was not produced" }
          # Rust scales populations to the map itself; map-size population presets were retired in v1.0.8.
          if (@(Get-ChildItem publish_out/assets/presets/rust_vanilla_*.json).Count -gt 0) { throw "Retired map-size population presets were packaged" }

      - name: Assemble and verify HPRM portable package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          ./scripts/Build-PortablePackage.ps1 `
            -PublishDirectory publish_out `
            -OutputDirectory package_out `
            -Version $version `
            -Commit "${{ github.sha }}"

      - name: Confirm minimal ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem package_out/HighPop-v*-win-x64.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $files = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } |
              Where-Object { -not $_.EndsWith('/') })
            $unexpected = @($files | Where-Object {
              $_ -ne 'HPRM/HighPop.exe' -and
              $_ -ne 'HPRM/CHANGELOG.md' -and
              -not $_.StartsWith('HPRM/assets/')
            })
            if ($unexpected.Count -gt 0) {
              throw "ZIP contains files outside the approved executable/assets/changelog set: $($unexpected -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Compute artifact name
        id: artifact
        shell: pwsh
        run: |
          # Branch names like agent/foo or PR refs (123/merge) contain '/', which artifact names reject.
          $safe = '${{ github.ref_name }}' -replace '[\\/:*?"<>|\r\n]', '-'
          "name=HighPop-$safe-win-x64" >> $env:GITHUB_OUTPUT

      - name: Upload testing package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: package_out/HighPop-v*-win-x64*
          if-no-files-found: error

  linux:
    # The Linux Desktop app and the headless host. The smoke tests target Windows, so they run in the
    # job above; here the Linux projects are built, checked on a real Linux host and packaged.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Linux projects
        run: |
          dotnet build HighPop.Desktop/HighPop.Desktop.csproj -c Release
          dotnet build HighPop.Server/HighPop.Server.csproj -c Release
          dotnet build HighPop.LinuxCheck/HighPop.LinuxCheck.csproj -c Release

      - name: Linux host checks
        run: dotnet run --project HighPop.LinuxCheck/HighPop.LinuxCheck.csproj -c Release --no-build

      - name: Publish desktop app and headless host
        run: |
          dotnet publish HighPop.Desktop/HighPop.Desktop.csproj -c Release -r linux-x64 --self-contained true -o publish_desktop
          dotnet publish HighPop.Server/HighPop.Server.csproj -c Release -r linux-x64 --self-contained true -o publish_server

      - name: Package and verify tarballs
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          scripts/build-linux-package.sh publish_desktop package_out "$version" desktop "$GITHUB_SHA"
          scripts/build-linux-package.sh publish_server package_out "$version" server "$GITHUB_SHA"
          (cd package_out && sha256sum --check ./*.sha256)

      - name: Build installers (.deb, AppImage)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          scripts/build-linux-deb.sh publish_desktop package_out "$version" desktop
          scripts/build-linux-deb.sh publish_server package_out "$version" server
          scripts/build-linux-appimage.sh publish_desktop package_out "$version"
          cp scripts/install-desktop.sh scripts/install-server.sh package_out/
          (cd package_out && sha256sum --check ./*.deb.sha256 ./*.AppImage.sha256)

      - name: Test the packages and installers
        run: scripts/test-linux-installers.sh package_out

      - name: Compute artifact name
        id: artifact
        run: |
          # Branch names like agent/foo or PR refs (123/merge) contain '/', which artifact names reject.
          safe="$(printf '%s' '${{ github.ref_name }}' | tr '\/:*?"<>|' '-')"
          echo "name=HighPop-${safe}-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Upload testing packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            package_out/HighPop-v*-linux-*
            package_out/*.deb
            package_out/*.deb.sha256
            package_out/HighPop-v*.AppImage
            package_out/HighPop-v*.AppImage.sha256
            package_out/install-desktop.sh
            package_out/install-server.sh
          if-no-files-found: error
