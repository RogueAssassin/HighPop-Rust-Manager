name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The main-branch run creates the version tag itself. Listening to that generated tag would
# start a second release run for the same version.
concurrency:
  group: highpop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the HighPop project version" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match project version $version" >&2
              exit 1
            fi
            publish=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; this main-branch push does not need another release."
            publish=false
          else
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HighPop.sln

      - name: Audit XAML command surface
        shell: pwsh
        run: ./scripts/Test-UiSurface.ps1

      - name: Build
        run: dotnet build HighPop.sln -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project HighPop.SmokeTests/HighPop.SmokeTests.csproj -c Release --no-build

      - name: Publish self-contained single file
        run: dotnet publish HighPop.Desktop/HighPop.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish_out

      - name: Confirm portable output
        shell: pwsh
        run: |
          if (-not (Test-Path publish_out/HighPop.exe)) { throw "HighPop.exe was not produced" }
          if (-not (Test-Path publish_out/assets/README.txt)) { throw "assets/README.txt was not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_highpop.json)) { throw "Rust presets were not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_vanilla.json)) { throw "Vanilla preset was not produced" }
          # Rust scales populations to the map itself; map-size population presets were retired in v1.0.8.
          if (@(Get-ChildItem publish_out/assets/presets/rust_vanilla_*.json).Count -gt 0) { throw "Retired map-size population presets were packaged" }

      - name: Verify release version and executable
        shell: pwsh
        run: |
          $exe = Get-Item publish_out/HighPop.exe
          if ($exe.Length -lt 1MB) { throw "HighPop.exe is unexpectedly small" }
          $expected = "${{ needs.prepare.outputs.version }}"
          $actual = $exe.VersionInfo.FileVersion
          if ($actual -ne "$expected.0") {
            throw "Release ${{ needs.prepare.outputs.tag }} does not match executable version $actual"
          }

      - name: Sign executable when a certificate is configured
        shell: pwsh
        env:
          HIGHPOP_SIGNING_CERT_BASE64: ${{ secrets.HIGHPOP_SIGNING_CERT_BASE64 }}
          HIGHPOP_SIGNING_CERT_PASSWORD: ${{ secrets.HIGHPOP_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HIGHPOP_SIGNING_CERT_BASE64)) {
            Write-Host "No signing certificate configured; publishing an unsigned community build."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "highpop-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:HIGHPOP_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found" }

          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com `
            /f $pfx /p $env:HIGHPOP_SIGNING_CERT_PASSWORD publish_out/HighPop.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          if ((Get-AuthenticodeSignature publish_out/HighPop.exe).Status -ne "Valid") {
            throw "The signed HighPop.exe failed Authenticode verification"
          }
          Remove-Item $pfx -Force

      - name: Assemble portable package
        shell: pwsh
        run: |
          ./scripts/Build-PortablePackage.ps1 `
            -PublishDirectory publish_out `
            -OutputDirectory . `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Commit "${{ github.sha }}"

      - name: Verify release package and checksums
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $zip = Get-Item "HighPop-$tag-win-x64.zip"
          $exe = Get-Item "HighPop-$tag-win-x64.exe"
          foreach ($file in @($zip, $exe)) {
            $checksumPath = "$($file.FullName).sha256"
            if (-not (Test-Path $checksumPath)) { throw "Missing checksum for $($file.Name)" }
            $expected = ((Get-Content $checksumPath -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $($file.Name)"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $files = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } |
              Where-Object { -not $_.EndsWith('/') })
            $required = @('HPRM/HighPop.exe', 'HPRM/CHANGELOG.md', 'HPRM/assets/README.txt')
            foreach ($requiredFile in $required) {
              if ($requiredFile -notin $files) { throw "ZIP is missing $requiredFile" }
            }
            $unexpected = @($files | Where-Object {
              $_ -ne 'HPRM/HighPop.exe' -and
              $_ -ne 'HPRM/CHANGELOG.md' -and
              -not $_.StartsWith('HPRM/assets/')
            })
            if ($unexpected.Count -gt 0) {
              throw "ZIP contains unexpected files: $($unexpected -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HighPop-${{ needs.prepare.outputs.tag }}-win-x64
          path: |
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.manifest.json
          if-no-files-found: error

      - name: Create release tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "HighPop Rust Manager ${{ needs.prepare.outputs.tag }}" "$env:GITHUB_SHA"
          git push origin "refs/tags/${{ needs.prepare.outputs.tag }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: HighPop Rust Manager ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.manifest.json

  linux-x64:
    # Added to the release the Windows job just created. If this job fails, the Windows release stands and
    # the Linux app simply sees no update asset yet (it never offers an update it cannot install).
    needs: [prepare, windows-x64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Linux projects
        run: |
          dotnet build HighPop.Desktop/HighPop.Desktop.csproj -c Release
          dotnet build HighPop.Server/HighPop.Server.csproj -c Release
          dotnet build HighPop.LinuxCheck/HighPop.LinuxCheck.csproj -c Release

      - name: Linux host checks
        run: dotnet run --project HighPop.LinuxCheck/HighPop.LinuxCheck.csproj -c Release --no-build

      - name: Publish desktop app and headless host
        run: |
          dotnet publish HighPop.Desktop/HighPop.Desktop.csproj -c Release -r linux-x64 --self-contained true -o publish_desktop
          dotnet publish HighPop.Server/HighPop.Server.csproj -c Release -r linux-x64 --self-contained true -o publish_server

      - name: Package tarballs
        run: |
          scripts/build-linux-package.sh publish_desktop . "${{ needs.prepare.outputs.version }}" desktop "${{ github.sha }}"
          scripts/build-linux-package.sh publish_server . "${{ needs.prepare.outputs.version }}" server "${{ github.sha }}"

      - name: Verify checksums
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          sha256sum --check "HighPop-$tag-linux-x64.tar.gz.sha256" "HighPop-$tag-linux-server-x64.tar.gz.sha256"

      - name: Prepare the apt signing key (optional)
        # With the APT_GPG_PRIVATE_KEY secret set, the .deb files also register the HighPop apt repository on first
        # install, so later versions arrive through apt. Without it the .deb files are built as before.
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
            gpg --batch --export > "$RUNNER_TEMP/highpop-archive-keyring.gpg"
            echo "HIGHPOP_APT_KEYRING=$RUNNER_TEMP/highpop-archive-keyring.gpg" >> "$GITHUB_ENV"
          else
            echo "::notice::APT_GPG_PRIVATE_KEY is not set; building .deb files without the apt source."
          fi

      - name: Build installers (.deb, AppImage)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          version="${{ needs.prepare.outputs.version }}"
          scripts/build-linux-deb.sh publish_desktop . "$version" desktop
          scripts/build-linux-deb.sh publish_server . "$version" server
          scripts/build-linux-appimage.sh publish_desktop . "$version"
          cp scripts/install-desktop.sh scripts/install-server.sh .
          sha256sum --check ./*.deb.sha256 ./*.AppImage.sha256

      - name: Test the packages and installers
        run: scripts/test-linux-installers.sh .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HighPop-${{ needs.prepare.outputs.tag }}-linux-x64
          path: |
            HighPop-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz
            HighPop-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-linux-server-x64.tar.gz
            HighPop-${{ needs.prepare.outputs.tag }}-linux-server-x64.tar.gz.sha256
            highpop-desktop_${{ needs.prepare.outputs.version }}_amd64.deb
            highpop-desktop_${{ needs.prepare.outputs.version }}_amd64.deb.sha256
            highpop-server_${{ needs.prepare.outputs.version }}_amd64.deb
            highpop-server_${{ needs.prepare.outputs.version }}_amd64.deb.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-x86_64.AppImage
            HighPop-${{ needs.prepare.outputs.tag }}-x86_64.AppImage.sha256
            install-desktop.sh
            install-server.sh
          if-no-files-found: error

      - name: Add Linux files to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: HighPop Rust Manager ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            HighPop-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz
            HighPop-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-linux-server-x64.tar.gz
            HighPop-${{ needs.prepare.outputs.tag }}-linux-server-x64.tar.gz.sha256
            highpop-desktop_${{ needs.prepare.outputs.version }}_amd64.deb
            highpop-desktop_${{ needs.prepare.outputs.version }}_amd64.deb.sha256
            highpop-server_${{ needs.prepare.outputs.version }}_amd64.deb
            highpop-server_${{ needs.prepare.outputs.version }}_amd64.deb.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-x86_64.AppImage
            HighPop-${{ needs.prepare.outputs.tag }}-x86_64.AppImage.sha256
            install-desktop.sh
            install-server.sh

  apt-repo:
    # Publishes the signed apt repository to GitHub Pages. A failure here leaves the finished release untouched.
    needs: [prepare, linux-x64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: HighPop-${{ needs.prepare.outputs.tag }}-linux-x64
          path: debs

      - name: Build the signed repository
        id: build
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then echo "::notice::APT_GPG_PRIVATE_KEY is not set, so the apt repository is not published."; exit 0; fi
          echo "have_key=true" >> "$GITHUB_OUTPUT"
          sudo apt-get install -y --no-install-recommends apt-utils gnupg xz-utils
          export GNUPGHOME="$(mktemp -d)"
          printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          export APT_GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          scripts/build-apt-repo.sh debs site

      - name: Upload the site
        if: steps.build.outputs.have_key == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.have_key == 'true'
        id: deploy
        uses: actions/deploy-pages@v5

  sign-assets:
    # Adds a detached GPG signature (.asc) for every release file, signed with the same key as the apt repository, and
    # the public key. A failure here leaves the finished release untouched.
    needs: [prepare, linux-x64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Sign and upload the release files
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then echo "::notice::APT_GPG_PRIVATE_KEY is not set, so the release files are not signed."; exit 0; fi
          export GNUPGHOME="$(mktemp -d)"
          printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          export APT_GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          mkdir signing-work
          gh release download "$TAG" --dir signing-work --pattern '*' --skip-existing
          bash scripts/sign-release-assets.sh signing-work
          gh release upload "$TAG" signing-work/*.asc --clobber
