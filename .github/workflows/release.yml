name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The main-branch run creates the version tag itself. Listening to that generated tag would
# start a second release run for the same version.
concurrency:
  group: highpop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' HighPop/HighPop.csproj | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the HighPop project version" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match project version $version" >&2
              exit 1
            fi
            publish=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; this main-branch push does not need another release."
            publish=false
          else
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HighPop.sln

      - name: Audit XAML command surface
        shell: pwsh
        run: ./scripts/Test-UiSurface.ps1

      - name: Build
        run: dotnet build HighPop.sln -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project HighPop.SmokeTests/HighPop.SmokeTests.csproj -c Release --no-build

      - name: Publish self-contained single file
        run: dotnet publish HighPop/HighPop.csproj -c Release -r win-x64 --self-contained true -o publish_out

      - name: Confirm portable output
        shell: pwsh
        run: |
          if (-not (Test-Path publish_out/HighPop.exe)) { throw "HighPop.exe was not produced" }
          if (-not (Test-Path publish_out/assets/README.txt)) { throw "assets/README.txt was not produced" }
          if (-not (Test-Path publish_out/assets/presets/rust_highpop.json)) { throw "Rust presets were not produced" }
          $mapPresets = @(Get-ChildItem publish_out/assets/presets/rust_vanilla_*.json |
            Where-Object { $_.BaseName -match '^rust_vanilla_(1000|1500|2000|2500|3000|3500|4000|4500|5000|5500|6000)$' })
          if ($mapPresets.Count -ne 11) { throw "Expected 11 Rust map-size presets, found $($mapPresets.Count)" }

      - name: Verify release version and executable
        shell: pwsh
        run: |
          $exe = Get-Item publish_out/HighPop.exe
          if ($exe.Length -lt 1MB) { throw "HighPop.exe is unexpectedly small" }
          $expected = "${{ needs.prepare.outputs.version }}"
          $actual = $exe.VersionInfo.FileVersion
          if ($actual -ne "$expected.0") {
            throw "Release ${{ needs.prepare.outputs.tag }} does not match executable version $actual"
          }

      - name: Sign executable when a certificate is configured
        shell: pwsh
        env:
          HIGHPOP_SIGNING_CERT_BASE64: ${{ secrets.HIGHPOP_SIGNING_CERT_BASE64 }}
          HIGHPOP_SIGNING_CERT_PASSWORD: ${{ secrets.HIGHPOP_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HIGHPOP_SIGNING_CERT_BASE64)) {
            Write-Host "No signing certificate configured; publishing an unsigned community build."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "highpop-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:HIGHPOP_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found" }

          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com `
            /f $pfx /p $env:HIGHPOP_SIGNING_CERT_PASSWORD publish_out/HighPop.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          if ((Get-AuthenticodeSignature publish_out/HighPop.exe).Status -ne "Valid") {
            throw "The signed HighPop.exe failed Authenticode verification"
          }
          Remove-Item $pfx -Force

      - name: Assemble portable package
        shell: pwsh
        run: |
          ./scripts/Build-PortablePackage.ps1 `
            -PublishDirectory publish_out `
            -OutputDirectory . `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Commit "${{ github.sha }}"

      - name: Verify release package and checksums
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $zip = Get-Item "HighPop-$tag-win-x64.zip"
          $exe = Get-Item "HighPop-$tag-win-x64.exe"
          foreach ($file in @($zip, $exe)) {
            $checksumPath = "$($file.FullName).sha256"
            if (-not (Test-Path $checksumPath)) { throw "Missing checksum for $($file.Name)" }
            $expected = ((Get-Content $checksumPath -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $($file.Name)"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $files = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } |
              Where-Object { -not $_.EndsWith('/') })
            $required = @('HPRM/HighPop.exe', 'HPRM/CHANGELOG.md', 'HPRM/assets/README.txt')
            foreach ($requiredFile in $required) {
              if ($requiredFile -notin $files) { throw "ZIP is missing $requiredFile" }
            }
            $unexpected = @($files | Where-Object {
              $_ -ne 'HPRM/HighPop.exe' -and
              $_ -ne 'HPRM/CHANGELOG.md' -and
              -not $_.StartsWith('HPRM/assets/')
            })
            if ($unexpected.Count -gt 0) {
              throw "ZIP contains unexpected files: $($unexpected -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HighPop-${{ needs.prepare.outputs.tag }}-win-x64
          path: |
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.manifest.json
          if-no-files-found: error

      - name: Create release tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "HighPop Rust Manager ${{ needs.prepare.outputs.tag }}" "$env:GITHUB_SHA"
          git push origin "refs/tags/${{ needs.prepare.outputs.tag }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: HighPop Rust Manager ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.exe.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.zip.sha256
            HighPop-${{ needs.prepare.outputs.tag }}-win-x64.manifest.json
